name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch MySQL Connector/J (build-time only, not committed)
        run: |
          mkdir -p lib
          curl -sSL -o connector.tar.gz \
            https://dev.mysql.com/get/Downloads/Connector-J/mysql-connector-j-9.1.0.tar.gz
          tar -xzf connector.tar.gz
          cp mysql-connector-j-9.1.0/mysql-connector-j-9.1.0.jar lib/mysql-connector-j.jar

      - name: Compile
        run: |
          find src -name "*.java" > sources.txt
          javac -encoding UTF-8 -cp "lib/mysql-connector-j.jar" -d out @sources.txt
